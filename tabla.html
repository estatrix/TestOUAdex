<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./navigation.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Table - Once Upon A Dex</title>
  <style>
    :root {
      --bg-body: #f4f7f9;
      --bg-card: rgba(255, 255, 255, 0.9);
      --text-main: #1a202c;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --primary-blue: #3182ce;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.02);
      --radius-lg: 16px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; color: var(--text-main); line-height: 1.5; min-height: 100vh; }
    
    .bg-blur-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
    .bg-image { position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; background-image: url('https://imgur.com/JPHaMJj.png'); background-size: cover; background-position: center; filter: blur(12px); transform: scale(1.05); }
    .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0.2, 0.3, 0.4); }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 24px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); backdrop-filter: blur(8px); padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .header h1 { font-size: 1.5rem; }
    .nav-link { color: var(--text-main); text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: rgba(255,255,255,0.8); transition: background 200ms; }
    .nav-link:hover { background: var(--border-color); }

    .controls-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .controls-card input, .controls-card select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); outline: none; font-family: inherit; }
    .controls-card input:focus, .controls-card select:focus { border-color: var(--primary-blue); }

    .table-container { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
    th { background: rgba(0,0,0,0.03); font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 200ms; }
    th:hover { background: rgba(0,0,0,0.08); }
    td img { width: 40px; height: 40px; object-fit: contain; }
    
    .tags-container { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { padding: 2px 8px; border-radius: 12px; color: white; font-size: 0.75rem; font-weight: 600; text-transform: capitalize; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    
    .row-total { font-weight: bold; color: var(--primary-blue); }
  </style>
</head>
<body>

  <div class="bg-blur-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>

  <div class="container">
    <header class="header">
      <h1>Character Database</h1>
      <!-- <a href="index.html" class="nav-link">← Back to Details</a> -->
    </header>

    <div class="controls-card">
      <div class="control-group">
        <label>Name or N.º</label>
        <input type="text" id="search-input" placeholder="Ej. Lucario, 448...">
      </div>
      <div class="control-group">
        <label>Filter Type</label>
        <select id="type-filter">
          <option value="all">All Types</option>
          <option value="normal">Normal</option><option value="fire">Fire</option><option value="water">Water</option>
          <option value="electric">Electric</option><option value="grass">Grass</option><option value="ice">Ice</option>
          <option value="fighting">Fighting</option><option value="poison">Poison</option><option value="ground">Ground</option>
          <option value="flying">Flying</option><option value="psychic">Psychic</option><option value="bug">Bug</option>
          <option value="rock">Rock</option><option value="ghost">Ghost</option><option value="dragon">Dragon</option>
          <option value="dark">Dark</option><option value="steel">Steel</option><option value="fairy">Fairy</option>
        </select>
      </div>
      <div class="control-group">
        <label>Min. Total Stats</label>
        <input type="number" id="min-total" placeholder="0" min="0" max="1000" style="width: 120px;">
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th data-sort="number">N.º ↕</th>
            <th>Sprite</th>
            <th data-sort="name">Name ↕</th>
            <th>Type/s</th>
            <th data-sort="hp">HP ↕</th>
            <th data-sort="attack">Atk ↕</th>
            <th data-sort="defense">Def ↕</th>
            <th data-sort="spAttack">SpA ↕</th>
            <th data-sort="spDefense">SpD ↕</th>
            <th data-sort="speed">Spe ↕</th>
            <th data-sort="total">Total ↕</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script src="./data.js"></script>
  <script>
    const TYPE_COLORS = {
      normal: '#A8A878', fire: '#F08030', water: '#6890F0', electric: '#F8D030',
      grass: '#78C850', ice: '#98D8D8', fighting: '#C03028', poison: '#A040A0',
      ground: '#E0C068', flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',
      rock: '#B8A038', ghost: '#705898', dragon: '#7038F8', dark: '#705848',
      steel: '#B8B8D0', fairy: '#EE99AC'
    };

    let allPokemon = [];
    let currentSort = { col: 'number', asc: true };
    const calculateTotal = (stats) => Object.values(stats).reduce((a, b) => a + b, 0);
    const initData = () => {
      if (typeof pokemonData === 'undefined') return;
      allPokemon = Object.entries(pokemonData)
        .filter(([_, data]) => data.number)
        .map(([key, data]) => ({
          id: key,
          ...data,
          total: calculateTotal(data.stats)
        }));
      renderTable();
    };
    const filterAndSortData = () => {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const typeVal = document.getElementById('type-filter').value;
      const minTotal = parseInt(document.getElementById('min-total').value) || 0;
      let filtered = allPokemon.filter(p => {
        const matchNameOrNum = p.name.toLowerCase().includes(searchVal) || p.number.toString().includes(searchVal);
        const matchType = typeVal === 'all' || p.types.map(t => t.toLowerCase()).includes(typeVal);
        const matchTotal = p.total >= minTotal;
        return matchNameOrNum && matchType && matchTotal;
      });
      filtered.sort((a, b) => {
        let valA, valB;
        if (currentSort.col === 'number') {
          valA = parseInt(a.number.toString().replace(/\D/g, ''));
          valB = parseInt(b.number.toString().replace(/\D/g, ''));
        } else if (currentSort.col === 'name') {
          valA = a.name; valB = b.name;
        } else if (currentSort.col === 'total') {
          valA = a.total; valB = b.total;
        } else {
          valA = a.stats[currentSort.col]; valB = b.stats[currentSort.col];
        }
        if (valA < valB) return currentSort.asc ? -1 : 1;
        if (valA > valB) return currentSort.asc ? 1 : -1;
        return 0;
      });
      return filtered;
    };
    const renderTable = () => {
      const tbody = document.getElementById('table-body');
      const dataToRender = filterAndSortData();
      tbody.innerHTML = dataToRender.map(p => `
        <tr>
          <td>#${p.number}</td>
          <td><img src="${p.image}" alt="${p.name}"></td>
          <td style="font-weight: 600;">${p.name}</td>
          <td>
            <div class="tags-container">
              ${p.types.map(t => `<span class="tag" style="background-color: ${TYPE_COLORS[t.toLowerCase()] || '#777'}">${t}</span>`).join('')}
            </div>
          </td>
          <td>${p.stats.hp}</td>
          <td>${p.stats.attack}</td>
          <td>${p.stats.defense}</td>
          <td>${p.stats.spAttack}</td>
          <td>${p.stats.spDefense}</td>
          <td>${p.stats.speed}</td>
          <td class="row-total">${p.total}</td>
        </tr>
      `).join('');
    };
    document.getElementById('search-input').addEventListener('input', renderTable);
    document.getElementById('type-filter').addEventListener('change', renderTable);
    document.getElementById('min-total').addEventListener('input', renderTable);
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (currentSort.col === col) {
          currentSort.asc = !currentSort.asc;
        } else {
          currentSort.col = col;
          currentSort.asc = true;
        }
        renderTable();
      });
    });
    document.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>
