<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Once Upon A Dex</title>
  <style>
    /* =========================================
       1. VARIABLES & RESET
       ========================================= */
    :root {
      --bg-body: #f4f7f9;
      --bg-card: rgba(255, 255, 255, 0.9);
      --text-main: #1a202c;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --primary-cyan: #0bc5ea;
      --primary-blue: #3182ce;
      
      --dynamic-color: var(--primary-cyan);
      --dynamic-gradient: linear-gradient(135deg, #00B4DB, #0083B0);
      
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.02);
      
      --radius-lg: 16px;
      --radius-md: 12px;
      --transition-speed: 250ms;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      min-height: 100vh;
    }

    /* =========================================
       BACKGROUND BLUR LAYER
       ========================================= */
    .bg-blur-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; overflow: hidden;
    }
    .bg-image {
      position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
      background-image: url('https://imgur.com/JPHaMJj.png');
      background-size: cover; background-position: center;
      filter: blur(12px); transform: scale(1.05);
    }
    .bg-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0.2, 0.3, 0.4);
    }

    /* =========================================
       2. MAIN LAYOUT
       ========================================= */
    .dashboard-container {
      max-width: 1280px; margin: 0 auto; padding: 24px;
      display: flex; flex-direction: column; gap: 24px;
      position: relative; z-index: 1;
    }

    /* HEADER */
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); backdrop-filter: blur(8px);
      padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-icon {
      width: 40px; height: 40px; background: var(--dynamic-gradient);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 1.2rem;
      transition: background var(--transition-speed);
    }
    .header-title h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
    .header-title .dex-number { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    .header-title p { font-size: 0.8rem; color: var(--text-muted); }
    .header-right { display: flex; gap: 12px; }
    
    .custom-select {
      padding: 8px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md);
      font-family: inherit; font-size: 0.95rem; outline: none;
      background-color: rgba(255, 255, 255, 0.8); cursor: pointer;
      transition: border-color var(--transition-speed);
    }
    .custom-select:focus { border-color: var(--primary-blue); }

    /* MAIN GRID */
    .main-grid {
      display: grid; grid-template-columns: 45% 1fr; gap: 24px; align-items: start;
    }

    /* =========================================
       3. COMPONENTS / CARDS
       ========================================= */
    .card {
      background: var(--bg-card); backdrop-filter: blur(8px);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      padding: 24px; margin-bottom: 24px;
      transition: transform var(--transition-speed), box-shadow var(--transition-speed);
    }
    .card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

    /* IMAGE CARD */
    .image-card {
      display: flex; justify-content: center; align-items: center; height: 400px;
      background: radial-gradient(circle, rgba(230, 247, 255, 0.8) 0%, rgba(255, 255, 255, 0.7) 70%);
      border: 1px solid var(--border-color); padding: 16px;
    }
    .image-card img {
      width: 100%; height: 100%; object-fit: contain;
      transition: opacity var(--transition-speed), transform var(--transition-speed);
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    }
    .fade-enter { opacity: 0; transform: scale(0.95); }
    .fade-enter-active { opacity: 1; transform: scale(1); }

    /* TEXT & TAGS */
    .desc-text { font-size: 1.05rem; color: var(--text-main); line-height: 1.6; }
    .tags-container { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
      padding: 4px 14px; border-radius: 20px; color: white; font-size: 0.85rem;
      font-weight: 600; text-transform: capitalize; letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* INFO CARD DYNAMIC */
    .info-card { background: var(--dynamic-gradient); color: white; border: none; transition: background 400ms ease; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .info-item { display: flex; flex-direction: column; gap: 4px; }
    .info-label { font-size: 0.85rem; opacity: 0.85; display: flex; align-items: center; gap: 6px; }
    .info-value { font-size: 1.15rem; font-weight: 600; text-transform: capitalize; }
    
    .info-help-btn {
      background: rgba(255,255,255,0.25); border: none; color: white;
      width: 18px; height: 18px; border-radius: 50%; font-size: 0.75rem;
      font-weight: bold; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; transition: all 200ms ease;
    }
    .info-help-btn:hover { background: rgba(255,255,255,0.45); transform: scale(1.1); }

    /* STATS CARD */
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: inherit; }
    .chart-wrapper {
      position: relative; height: 200px; margin-top: 20px;
      background-image: linear-gradient(to bottom, var(--border-color) 1px, transparent 1px); background-size: 100% 25%; 
    }
    .chart-bars { display: flex; justify-content: space-between; align-items: flex-end; height: 100%; padding: 0 10px; }
    .bar-group { display: flex; flex-direction: column; align-items: center; width: 12%; height: 100%; justify-content: flex-end; }
    /* Se cambió el background a --dynamic-gradient para que los colores de las barras de estadísticas coincidan */
    .bar-fill { width: 100%; background: var(--dynamic-gradient); border-radius: 4px 4px 0 0; transition: height 350ms cubic-bezier(0.4, 0, 0.2, 1), background 400ms ease; position: relative; }
    .bar-value { position: absolute; top: -24px; width: 100%; text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--text-main); }
    .bar-label { margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); font-weight: 500; text-align: center; }

    /* =========================================
       4. EVOLUTION CARD
       ========================================= */
    .evolution-card {
      background-color: #555555;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255, 255, 255, 0.03) 15px, rgba(255, 255, 255, 0.03) 30px);
      color: white;
      border: none;
      box-shadow: var(--shadow-md);
      display: none; 
    }
    .evolution-card .section-title { color: white; font-size: 1.15rem; margin-bottom: 24px; }
    .evolution-line {
      display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap;
    }
    .evo-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    
    .evo-img-wrapper {
      width: 100px; height: 100px; border-radius: 50%;
      border: 4px solid white; background-color: #4a5568;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }
    .evo-img-wrapper img { width: 85%; height: 85%; object-fit: contain; }
    .evo-details { text-align: center; }
    .evo-name { font-size: 1rem; font-weight: 600; }
    .evo-number { color: #cbd5e0; font-size: 0.8rem; font-weight: 400; margin-left: 4px; }
    .evo-types { display: flex; gap: 4px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
    .evo-types .tag { padding: 2px 8px; font-size: 0.7rem; }
    
    .evo-arrow-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .evo-condition {
      font-size: 0.7rem; color: #fff; background: rgba(0,0,0,0.3);
      padding: 4px 8px; border-radius: 12px; font-weight: 500; text-align: center;
      max-width: 90px;
    }
    .evo-arrow { font-size: 2rem; color: white; font-weight: bold; line-height: 1; margin-top: -5px; }

    /* =========================================
       5. TOOLTIP (HOVER)
       ========================================= */
    .tooltip {
      position: absolute; background-color: var(--text-main); color: #fff;
      padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.85rem;
      line-height: 1.4; max-width: 250px; pointer-events: none; z-index: 1000;
      opacity: 0; visibility: hidden; transform: translateY(5px);
      transition: opacity 200ms ease, transform 200ms ease; box-shadow: var(--shadow-md);
    }
    .tooltip.show { opacity: 1; visibility: visible; transform: translateY(0); }

    /* RESPONSIVE */
    @media (max-width: 992px) {
      .main-grid { grid-template-columns: 1fr; }
      .image-card { height: 350px; }
    }
    @media (max-width: 600px) {
      .dashboard-header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .header-right { width: 100%; } .custom-select { flex: 1; }
      .info-grid { grid-template-columns: 1fr; gap: 16px; }
      .chart-bars { padding: 0; } .bar-label { font-size: 0.65rem; }
      .evolution-line { flex-direction: column; gap: 12px; }
      .evo-arrow-container { transform: rotate(90deg); margin: 10px 0; }
      .evo-condition { transform: rotate(-90deg); margin-left: 20px; }
    }
  </style>
</head>
<body>

  <!-- FONDO DIFUMINADO -->
  <div class="bg-blur-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>

  <div class="dashboard-container">
    
    <!-- HEADER -->
    <header class="dashboard-header">
      <div class="header-left">
        <div class="header-icon">P</div>
        <div class="header-title">
          <h1 id="header-name">Character <span class="dex-number" id="header-number">--</span></h1>
          <p>Once Upon A Dex</p>
        </div>
      </div>
      <div class="header-right">
        <select id="pokemon-selector" class="custom-select" aria-label="Select Character"></select>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main-grid">
      
      <!-- LEFT COLUMN -->
      <div class="col-left">
        <article class="card image-card">
          <img id="pokemon-image" src="" alt="Character image" class="fade-enter-active">
        </article>
        <article class="card stats-card">
          <h2 class="section-title">Base Stats</h2>
          <div class="chart-wrapper">
            <div class="chart-bars" id="stats-container"></div>
          </div>
        </article>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">
        <article class="card description-card">
          <div style="margin-bottom: 16px;">
            <div class="tags-container" id="types-container"></div>
          </div>
          <p id="pokemon-desc" class="desc-text"></p>
        </article>

        <!-- CAJA DE INFORMACIÓN UNIFICADA -->
        <article class="card info-card">
          <div class="info-grid">
            <div class="info-col">
              <div class="info-item">
                <span class="info-label">Height</span>
                <span class="info-value" id="info-height">--</span>
              </div>
              <div class="info-item" style="margin-top: 16px;">
                <span class="info-label">Weight</span>
                <span class="info-value" id="info-weight">--</span>
              </div>
              <div class="info-item" style="margin-top: 16px;">
                <span class="info-label">Gender</span>
                <span class="info-value" id="info-gender">♂ ♀</span>
              </div>
              <!-- Signature Move -->
              <div class="info-item" style="margin-top: 16px;" id="signature-container">
                <span class="info-label">Signature Move</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="info-value" id="info-signature-move">--</span>
                  <button class="info-help-btn tooltip-trigger" id="help-btn-move" aria-label="Help">?</button>
                </div>
              </div>
            </div>
            
            <div class="info-col">
              <div class="info-item">
                <span class="info-label">Category</span>
                <span class="info-value" id="info-category">--</span>
              </div>
              <!-- 2da Categoría -->
              <div class="info-item" style="margin-top: 16px;" id="category2-container">
                <span class="info-label">Theme</span>
                <span class="info-value" id="info-category2">--</span>
              </div>
              <!-- Ability con el botón de ayuda al lado -->
              <div class="info-item" style="margin-top: 16px;">
                <span class="info-label">Ability</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="info-value" id="info-ability1">--</span>
                  <button class="info-help-btn tooltip-trigger" id="help-btn-1" aria-label="Help">?</button>
                </div>
              </div>
              <!-- Hidden Ability con el botón de ayuda al lado -->
              <div class="info-item" style="margin-top: 16px;" id="hidden-ability-container">
                <span class="info-label">Hidden Ability</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="info-value" id="info-ability2">--</span>
                  <button class="info-help-btn tooltip-trigger" id="help-btn-2" aria-label="Help">?</button>
                </div>
              </div>
            </div>
          </div>
        </article>

        <!-- EVOLUTION CARD -->
        <article class="card evolution-card" id="evolution-container">
          <h2 class="section-title">Evolutions</h2>
          <div class="evolution-line" id="evolution-line-content">
            <!-- Generado dinámicamente -->
          </div>
        </article>
      </div>

    </main>
  </div>

  <div id="ability-tooltip" class="tooltip"></div>

  <!-- 1. Load Data Externally -->
  <script src="./data.js"></script>

  <!-- 2. Application Logic -->
  <script>
    const DOM = {
      selector: document.getElementById('pokemon-selector'),
      name: document.getElementById('header-name'),
      number: document.getElementById('header-number'),
      image: document.getElementById('pokemon-image'),
      desc: document.getElementById('pokemon-desc'),
      height: document.getElementById('info-height'),
      weight: document.getElementById('info-weight'),
      gender: document.getElementById('info-gender'),
      category: document.getElementById('info-category'),
      category2: document.getElementById('info-category2'),
      category2Container: document.getElementById('category2-container'),
      ability1: document.getElementById('info-ability1'),
      ability2: document.getElementById('info-ability2'),
      helpBtn1: document.getElementById('help-btn-1'),
      helpBtn2: document.getElementById('help-btn-2'),
      helpBtnMove: document.getElementById('help-btn-move'),
      hiddenAbilityContainer: document.getElementById('hidden-ability-container'),
      signatureContainer: document.getElementById('signature-container'),
      signatureMove: document.getElementById('info-signature-move'),
      evolutionContainer: document.getElementById('evolution-container'),
      evolutionLineContent: document.getElementById('evolution-line-content'),
      typesContainer: document.getElementById('types-container'),
      statsContainer: document.getElementById('stats-container'),
      tooltip: document.getElementById('ability-tooltip')
    };

    /* =========================================
       API & CACHE LOGIC
       ========================================= */
    const cache = { ability: {}, move: {} };

    const formatName = (name) => name.toLowerCase().replace(/\s+/g, '-');

    const fetchDescription = async (type, name) => {
      const formattedName = formatName(name);
      if (cache[type][formattedName]) return cache[type][formattedName];

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/${type}/${formattedName}`);
        if (!response.ok) throw new Error(`${type} not found`);
        const data = await response.json();
        
        let targetEntry;
        if (type === 'ability') {
          targetEntry = data.flavor_text_entries.find(entry => 
            entry.language.name === 'en' && (entry.version_group.name === 'x-y' || entry.version_group.name === 'omega-ruby-alpha-sapphire')
          ) || data.flavor_text_entries.find(entry => entry.language.name === 'en');
        } else {
          targetEntry = data.flavor_text_entries.find(entry => entry.language.name === 'en');
        }
        
        const description = targetEntry ? targetEntry.flavor_text.replace(/\n|\f/g, ' ') : 'Description not available in English.';
        cache[type][formattedName] = description;
        return description;
      } catch (error) {
        return 'Could not load description. Please try again.';
      }
    };

    /* =========================================
       RENDER MODULES & THEME LOGIC
       ========================================= */
    
    // Objeto centralizado con los colores de los tipos
    const TYPE_COLORS = {
      normal: '#A8A878', fire: '#F08030', water: '#6890F0', electric: '#F8D030',
      grass: '#78C850', ice: '#98D8D8', fighting: '#C03028', poison: '#A040A0',
      ground: '#E0C068', flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',
      rock: '#B8A038', ghost: '#705898', dragon: '#7038F8', dark: '#705848',
      steel: '#B8B8D0', fairy: '#EE99AC'
    };

    const populateSelector = () => {
      DOM.selector.innerHTML = ''; 
      if (typeof pokemonData === 'undefined') return;
      Object.keys(pokemonData).forEach(key => {
        const option = document.createElement('option');
        option.value = key; option.textContent = pokemonData[key].name;
        DOM.selector.appendChild(option);
      });
    };

    const applyDynamicTheme = (types) => {
      // Obtenemos el color principal del Tipo 1
      const color1 = TYPE_COLORS[types[0].toLowerCase()] || '#0bc5ea';
      
      // Obtenemos el color del Tipo 2 (Si no hay, usamos el mismo que el Tipo 1)
      let color2 = color1;
      if (types.length > 1) {
        color2 = TYPE_COLORS[types[1].toLowerCase()] || color1;
      }
      
      // Seteamos las variables de CSS a nivel de documento
      document.documentElement.style.setProperty('--dynamic-color', color1);
      document.documentElement.style.setProperty('--dynamic-gradient', `linear-gradient(135deg, ${color1}, ${color2})`);
    };

    const createTag = (typeStr) => {
      return `<span class="tag" style="background-color: ${TYPE_COLORS[typeStr.toLowerCase()] || '#718096'}">${typeStr}</span>`;
    };

    const updateDashboard = (pokemonId) => {
      if (typeof pokemonData === 'undefined') return;
      const data = pokemonData[pokemonId];
      if (!data) return;

      applyDynamicTheme(data.types);
      DOM.name.innerHTML = `${data.name} <span class="dex-number" id="header-number">N.º ${data.number}</span>`;
      
      DOM.image.classList.remove('fade-enter-active'); DOM.image.classList.add('fade-enter');
      setTimeout(() => { DOM.image.src = data.image; DOM.image.classList.remove('fade-enter'); DOM.image.classList.add('fade-enter-active'); }, 50);

      DOM.desc.textContent = data.description;
      DOM.height.textContent = data.height; DOM.weight.textContent = data.weight;
      DOM.gender.textContent = data.gender; DOM.category.textContent = data.category;
      DOM.typesContainer.innerHTML = data.types.map(createTag).join('');

      if (data.category2) {
        DOM.category2.textContent = data.category2;
        DOM.category2Container.style.display = 'flex';
      } else {
        DOM.category2Container.style.display = 'none';
      }

      DOM.ability1.textContent = data.abilities[0] || "--";
      DOM.helpBtn1.dataset.ability = data.abilities[0];
      if (data.abilities[1]) {
        DOM.ability2.textContent = data.abilities[1];
        DOM.helpBtn2.dataset.ability = data.abilities[1];
        DOM.hiddenAbilityContainer.style.display = 'flex';
      } else { DOM.hiddenAbilityContainer.style.display = 'none'; }

      if (data.signatureMove) {
        DOM.signatureContainer.style.display = 'flex';
        DOM.signatureMove.textContent = data.signatureMove;
        DOM.helpBtnMove.dataset.move = data.signatureMove;
      } else {
        DOM.signatureContainer.style.display = 'none';
      }

      if (data.evolution && data.evolution.length > 0) {
        DOM.evolutionContainer.style.display = 'block';
        DOM.evolutionLineContent.innerHTML = data.evolution.map((stage, index) => `
          ${index > 0 ? `
            <div class="evo-arrow-container">
              ${stage.condition ? `<span class="evo-condition">${stage.condition}</span>` : ''}
              <span class="evo-arrow">›</span>
            </div>
          ` : ''}
          <div class="evo-stage">
            <div class="evo-img-wrapper"><img src="${stage.image}" alt="${stage.name}"></div>
            <div class="evo-details">
              <div class="evo-name">${stage.name} <span class="evo-number">N.º ${stage.number}</span></div>
              <div class="evo-types">${stage.types.map(createTag).join('')}</div>
            </div>
          </div>
        `).join('');
      } else {
        DOM.evolutionContainer.style.display = 'none';
      }

      const maxStat = 150;
      const statKeys = ['hp', 'attack', 'defense', 'spAttack', 'spDefense', 'speed'];
      const statLabels = ['HP', 'Attack', 'Defense', 'Sp. Atk', 'Sp. Def', 'Speed'];
      
      if (DOM.statsContainer.children.length === 0) {
        DOM.statsContainer.innerHTML = statKeys.map((k, i) => `
          <div class="bar-group">
            <div class="bar-fill" id="bar-${k}"><div class="bar-value" id="val-${k}">0</div></div>
            <div class="bar-label">${statLabels[i]}</div>
          </div>
        `).join('');
      }
      setTimeout(() => {
        statKeys.forEach(k => {
          document.getElementById(`bar-${k}`).style.height = `${Math.min((data.stats[k] / maxStat) * 100, 100)}%`;
          document.getElementById(`val-${k}`).textContent = data.stats[k];
        });
      }, 50);
    };

    /* =========================================
       EVENTS & INIT
       ========================================= */
    DOM.selector.addEventListener('change', (e) => updateDashboard(e.target.value));

    document.querySelectorAll('.tooltip-trigger').forEach(btn => {
      btn.addEventListener('mouseenter', async (e) => {
        const target = e.target;
        const type = target.dataset.ability ? 'ability' : 'move';
        const name = target.dataset[type];
        if (!name) return;

        const rect = target.getBoundingClientRect();
        DOM.tooltip.style.left = `${rect.right + window.scrollX + 10}px`;
        DOM.tooltip.style.top = `${rect.top + window.scrollY - 10}px`;
        DOM.tooltip.textContent = 'Loading...';
        DOM.tooltip.classList.add('show');

        const description = await fetchDescription(type, name);
        if (DOM.tooltip.classList.contains('show') && target.dataset[type] === name) {
          DOM.tooltip.textContent = description;
        }
      });
      btn.addEventListener('mouseleave', () => DOM.tooltip.classList.remove('show'));
      btn.addEventListener('click', (e) => e.preventDefault());
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof pokemonData !== 'undefined') {
        populateSelector();
        const initialPokemon = pokemonData['lucario'] ? 'lucario' : Object.keys(pokemonData)[0];
        DOM.selector.value = initialPokemon; updateDashboard(initialPokemon);
      }
    });
  </script>
</body>
</html>
